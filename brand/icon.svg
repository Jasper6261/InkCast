      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4A63FF"/>
      <stop offset="1" stop-color="#2FE3CF"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
