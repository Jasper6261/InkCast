<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.overlayTitle">白板标注层</title>
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="pctools.css">
</head>
<body>
  <canvas id="board"></canvas>
  <canvas id="live"></canvas>
  <!-- v0.8.8：鼠标穿透时只留一条小工具栏：屏幕 | 白板、继续标注（鼠标移到这里时可以点，其他地方照常操作下面的窗口） -->
  <div id="mini" class="cluster" hidden>
    <span class="mini-dot" aria-hidden="true"></span>
    <div class="seg" role="tablist"><button type="button" id="mini-screen" class="on" data-i18n="seg.screen">屏幕</button><button type="button" id="mini-board" data-i18n="seg.board" data-i18n-title="ov.toBoardTitle">白板</button></div>
    <button type="button" id="mini-draw" class="mini-draw"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-7 7-5-5z"/><path d="M7.5 11.5c-3 0-4 2.5-4 4.5 0 2-1 3-1 3s5 .5 7-1.5c1.2-1.2 1.5-2.5 1.5-3.5"/></svg><span data-i18n="ov.miniDraw">继续标注</span></button>
  </div>

  <!-- v0.8.6：所有功能集中在屏幕上方一条工具栏（由 pctools.js 生成）：屏幕 | 白板 切换、画笔 / 荧光笔 / 橡皮 / 颜色、大小、撤销 / 清除、截图、鼠标穿透 -->
  <div id="ui">
    <div id="messages" aria-live="polite">
      <div id="overlay-status" role="status" data-i18n="ov.connecting">正在连接…</div>
      <div id="board-usage" role="status" hidden></div>
      <div id="board-notice" role="status"></div>
    </div>
  </div>

  <div id="hint" data-i18n="ov.hintInit">屏幕标注：用法和白板一样。点工具栏最右边的箭头切到鼠标穿透，工具栏会缩成一个小条，点“继续标注”回来。</div>

  <script src="i18n.js"></script>
  <script src="shared.js"></script>
  <script src="ink.js"></script>
  <script src="pctools.js"></script>
  <script type="module" src="overlay.js"></script>
</body>
</html>
